[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcrop"
version = "0.1.0"
description = "SmartCrop: Zero-Shot Length Prediction for Efficient Diffusion Language Models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Davide Beltrame"},
    {name = "Giacomo Cirò"},
    {name = "Luca Gandolfi"},
    {name = "Vittorio Rossi"},
]
keywords = [
    "diffusion",
    "language-models",
    "text-generation",
    "efficiency",
    "length-prediction",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # DLLM core library (required for generation)
    "dllm @ git+https://github.com/VittorioRossi/dllm.git@main",

    # Core ML/DL
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.20.0",

    # Evaluation
    "lm-eval>=0.4.0",
    "datasets>=2.0.0",
    "evaluate>=0.4.0",

    # Data processing
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "tqdm>=4.60.0",
    "jsonlines>=4.0.0",

    # Utilities
    "PyYAML>=6.0",
    "scipy>=1.7.0",
]

[project.urls]
Repository = "https://github.com/VittorioRossi/smartcrop"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["diffusion_llms*"]

[tool.setuptools.package-data]
diffusion_llms = ["**/*.yml", "**/*.yaml", "**/*.json"]
